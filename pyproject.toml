[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "search2adapt"
version = "1.0.0"
description = "Search2Adapt: Multi-Agent Collaborative Tree Search for Source-Free Unsupervised Domain Adaptation in Medical Image Segmentation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Yulong Shi" },
    { name = "Wenwen Zhang" },
    { name = "Ziyi Li" },
    { name = "Lin Qi" },
]
keywords = [
    "source-free domain adaptation",
    "medical image segmentation",
    "vision foundation model",
    "monte carlo tree search",
    "multi-agent",
    "knowledge distillation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "nibabel>=5.1",
    "Pillow>=9.5",
    "openai>=1.30",
    "tqdm>=4.66",
    "psutil>=5.9",
    "monai>=1.3",
]

[project.optional-dependencies]
vfm = [
    "opencv-python>=4.8",
    "hydra-core>=1.3",
]

[project.urls]
Homepage = "https://github.com/derekshiii/Search2Adapt"
Repository = "https://github.com/derekshiii/Search2Adapt"
Issues = "https://github.com/derekshiii/Search2Adapt/issues"

[project.scripts]
search2adapt = "search2adapt.cli:main"

[tool.setuptools.packages.find]
include = ["search2adapt*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.setuptools.package-data]
search2adapt = ["vfm/*.py", "vfm/biomedparse_backend/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests that need real data, GPUs or network access",
    "slow: tests that take more than a few seconds",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "search2adapt/vfm/biomedparse_backend/utils.py",
    "search2adapt/vfm/biomedparse_backend/npz_utils.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E741"]

[tool.ruff.lint.per-file-ignores]
"search2adapt/vfm/biomedparse_backend/inference.py" = ["E402", "F401"]
"search2adapt/vfm/*.py" = ["E402"]
